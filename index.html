<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/newItem.css" />
    <link rel="stylesheet" href="css/list.css" />
    <link rel="stylesheet" href="css/empty.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/sync.css" />

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <!-- 180×180 -->

    <link rel="canonical" href="https://smthmind.com" />
    <link rel="manifest" href="manifest.webmanifest" />

    <title>Something from Your Mind</title>
    <meta name="application-name" content="smthmind" />
    <meta
      name="description"
      content="A space to collect your thoughts locally on your device and revisit them for reflection"
    />

    <meta property="og:url" content="https://smthmind.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Something from Your Mind" />
    <meta
      property="og:description"
      content="A space to collect your thoughts locally on your device and revisit them for reflection"
    />
    <meta
      property="og:image"
      content="https://smthmind.com/assets/meta-image.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="smthmind.com" />
    <meta property="twitter:url" content="https://smthmind.com/" />
    <meta name="twitter:title" content="Something from Your Mind" />
    <meta
      name="twitter:description"
      content="A space to collect your thoughts locally on your device and revisit them for reflection"
    />
    <meta
      name="twitter:image"
      content="https://smthmind.com/assets/meta-image.png"
    />

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="44a9c031-8e10-419b-a75e-ce79805e308d"
    ></script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="smthmind" />
    <meta name="apple-mobile-web-app-title" content="smthmind" />
    <meta
      name="theme-color"
      content="#f5f2f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#2a2929"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="msapplication-starturl" content="https://smthmind.com" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
  </head>

  <body>
    <div class="app">
      <form id="newItem">
        <div id="tagWrapper">
          <div id="tagLabel">
            <span>#</span>
            <input
              id="newItemTag"
              type="text"
              placeholder="tag"
              autocomplete="on"
              name="tag"
              maxlength="16"
            />
          </div>
        </div>

        <textarea
          id="newItemText"
          placeholder="What's on your mind?"
        ></textarea>

        <div class="newItemControls">
          <div class="sentimentSelect" id="moodCheck">
            <label for="angry" class="sentimentLabel">
              <input type="radio" id="angry" name="sentiment" value="angry" />
              <img src="assets/angry.png" alt="angry" />
            </label>

            <label for="sad" class="sentimentLabel">
              <input type="radio" id="sad" name="sentiment" value="sad" />
              <img src="assets/sad.png" alt="sad" />
            </label>

            <label for="neutral" class="sentimentLabel">
              <input
                type="radio"
                id="neutral"
                name="sentiment"
                value="neutral"
              />
              <img src="assets/neutral.png" alt="neutral" />
            </label>

            <label for="good" class="sentimentLabel">
              <input type="radio" id="good" name="sentiment" value="good" />
              <img src="assets/good.png" alt="good" />
            </label>

            <label for="happy" class="sentimentLabel">
              <input type="radio" id="happy" name="sentiment" value="happy" />
              <img src="assets/happy.png" alt="happy" />
            </label>
          </div>

          <button id="actionButton">
            <div class="actionCircle">↩</div>
          </button>
        </div>
      </form>

      <div id="listContainer">
        <div id="top">
          <div id="listHeader">
            <span
              class="button"
              id="clearFilter"
              onClick="getAndDisplayThoughts()"
              >Back</span
            >
            <div id="listFilter"></div>
            <div id="menu">
              <div class="button" id="syncLink">↕Sync</div>
              <div class="button" id="exportLink">↓Export</div>
              <div class="button">
                <a href="https://tally.so/r/3E0OjL" target="_blank"
                  >↗Feedback</a
                >
              </div>
            </div>
          </div>
          <div id="filters"></div>
        </div>
        <div id="list"></div>
      </div>
    </div>

    <script src="js/dexie.min.js"></script>
    <script src="js/dexie-export-import.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>

    <script src="js/sync-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/sync.js"></script>
    <script src="js/main.js"></script>
    <script src="js/shortcuts.js"></script>

    <div id="syncPanel" hidden>
      <div id="syncPanelContent">
        <div id="syncClose" class="button">✕</div>
        <div id="syncSignIn">
          <p class="syncTitle">Sync your thoughts</p>
          <p class="syncHint">Sign in with a magic link to sync entries across devices. Your data stays local unless you sign in.</p>
          <form id="syncEmailForm">
            <input id="syncEmailInput" type="email" placeholder="your@email.com" required />
            <button id="syncEmailButton" type="submit">Send link</button>
          </form>
          <p id="syncStatus"></p>
        </div>
        <div id="syncSignedIn" style="display: none">
          <p class="syncTitle">Synced</p>
          <p class="syncHint" id="syncEmail"></p>
          <p class="syncHint">Last sync: <span id="syncLastTime">–</span></p>
          <button id="syncNowButton">Sync now</button>
          <button id="syncSignOutButton" class="secondary">Sign out</button>
        </div>
      </div>
    </div>

    <script>
      // Register service worker for PWA functionality
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log(
                "Service Worker registered successfully:",
                registration.scope,
              );
            })
            .catch((error) => {
              console.log("Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
